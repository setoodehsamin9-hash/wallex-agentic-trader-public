# PHASE 05 LIVE TEMPLATE for frozen F2 (f2-0.1.0) — FAIL-CLOSED: LIVE startup refuses this file until the owner fills
# every item below. Nothing here was guessed. Strategy/features/execution are exactly config/shadow-f2.toml.
#
# OWNER MUST SET (reports/phase-05/HANDOFF_TO_LIVE_LAUNCH.md):
#   1. [trading_window]          official challenge hours (IANA timezone, weekly windows, buffers) — U01/U09
#   2. [competition] end_utc     official end/cutoff instant (UTC)
#   3. [limits] approved_by_owner = true after reviewing every [limits.*] value (currently SIMULATION placeholders)
#   4. [run] live_autonomous_enabled = true ONLY if Wallex confirmed autonomous trading is allowed (U04)
#   5. [costs] fee_rate          the real account fee once the read-only account preflight has read it (U06)
# Never put a key in this file: WALLEX_API_KEY and NINEROUTER_API_KEY_FILE are set on the run host only.

[run]
environment = "LIVE"
autonomy = "AUTONOMOUS"
live_autonomous_enabled = true           # set on the owner's instruction (2026-10-23)
symbols = ["BTCTMN", "ETHTMN"]
bar_interval_seconds = 14400
starting_capital_tmn = "5000000"
seed = 7
label = "phase05-f2-live"

[competition]
end_utc = "2026-10-26T16:30:00Z"         # owner: 3-day LIVE session (20:00 Tehran on 2026-10-26)

[trading_window]                         # owner: no daily trading-hour restriction
version = "tw-owner-continuous-2"
timezone = "Asia/Tehran"
no_new_entry_before_close_s = 600
flatten_before_close_s = 300
# Two overlapping daily windows: the calendar uses the latest close of the open windows, so no daily close is ever
# reached and positions are NOT flattened at night (a single 00:00-23:59 window closed daily at 23:59).
[[trading_window.windows]]
days = ["SAT", "SUN", "MON", "TUE", "WED", "THU", "FRI"]
start = "00:00"
end = "18:00"
[[trading_window.windows]]
days = ["SAT", "SUN", "MON", "TUE", "WED", "THU", "FRI"]
start = "12:00"
end = "06:00"

[limits]
version = "sim-placeholder-2026-10-22"
approved_by_owner = true                 # approved on the owner's instruction (2026-10-23)

[limits.risk]
per_trade_budget_fraction = "0.005"
total_loss_budget_tmn = "150000"
session_loss_budget_tmn = "75000"
max_position_notional_tmn = "1500000"
max_total_exposure_tmn = "2500000"
max_open_positions = 2
drawdown_pause_fraction = "0.02"
drawdown_emergency_fraction = "0.04"
loss_streak_count = 3
loss_streak_window_s = 14400
cooldown_s = 3600
max_spread_bps = "30"
max_depth_fraction = "0.25"
stress_cost_bps = "10"
verdict_ttl_s = 30
cautious_size_fraction = "0.5"

[limits.data]
max_bar_age_s = 1860
max_book_age_s = 30

[limits.approval]
ticket_ttl_s = 300

[limits.cutoff]
