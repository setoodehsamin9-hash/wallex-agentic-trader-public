# PHASE 04 ROUND 2 experiment base: F2 time-series momentum, 4h decisions (frozen research configuration
# F2|4h|EMA48|m5|regime-on, reports/phase-04/round2/PREREGISTRATION_R2.md and TRAIN.json). Derived from
# config/experiments/phase04/base-1h-c2-v2.toml: limits/costs/execution are the same SIMULATION PLACEHOLDERS
# (approved_by_owner = false keeps LIVE from ever starting on these values). Differences: [run] interval/label,
# [features] F2/regime-r2 settings, [strategy] F2, and [limits.cutoff] widened so a 1h-base backtest can flatten
# (the liquidation buffer must exceed one base bar).

[run]
environment = "BACKTEST"
autonomy = "AUTONOMOUS"
live_autonomous_enabled = false
symbols = ["BTCTMN", "ETHTMN"]
bar_interval_seconds = 14400
starting_capital_tmn = "5000000"
seed = 7
label = "phase04r2-f2-tsm"

[limits]
version = "sim-placeholder-2026-10-22"
approved_by_owner = false

[limits.risk]
per_trade_budget_fraction = "0.005"
total_loss_budget_tmn = "150000"
session_loss_budget_tmn = "75000"
max_position_notional_tmn = "1500000"
max_total_exposure_tmn = "2500000"
max_open_positions = 2
drawdown_pause_fraction = "0.02"
drawdown_emergency_fraction = "0.04"
loss_streak_count = 3
loss_streak_window_s = 14400
cooldown_s = 3600
max_spread_bps = "30"
max_depth_fraction = "0.25"
stress_cost_bps = "10"
verdict_ttl_s = 30
cautious_size_fraction = "0.5"

[limits.data]
max_bar_age_s = 1860
max_book_age_s = 30

[limits.approval]
ticket_ttl_s = 300

[limits.cutoff]
no_new_entry_before_end_s = 14400       # one 4h decision bar
liquidation_start_before_end_s = 7200   # two 1h base bars, so the liquidation order fills before the period end

[limits.kill]
max_consecutive_execution_errors = 3
reconciliation_tolerance_tmn = "1000"

[costs]
fee_rate = "0.0025"
fee_source = "ASSUMED"
backtest_slippage_bps = "5"

[execution]
entry_order_type = "LIMIT"
entry_limit_slippage_bps = "20"
exit_limit_slippage_bps = "30"
entry_ttl_s = 900

[features]
atr_bars = 14
trend_bars = 24                         # unused by F2 (kept for the shared feature schema)
volume_bars = 20
regime_trend_atr = "1.0"
regime_shock_atr_pct = "0.02"
ema_bars = 48                           # F2 L = 48 4h bars (8 days), frozen on TRAIN
regime_er_bars = 42                     # regime-r2-0.1.0 (pre-registered, not searched)
regime_rank_bars = 1080

[strategy]
active = "F2_tsm"

[strategy.c1]
version = "c1-0.2.0"
lookback_bars = 24
buffer_atr = "0.1"
stop_atr = "3"
max_holding_s = 43200
candidate_ttl_s = 600
min_edge_over_cost_bps = "20"
exit_mode = "TIME"
min_atr_cost_ratio = "1.0"

[strategy.f2]
version = "f2-0.1.0"
entry_band_atr = "0.5"
stop_atr = "5"
trail_atr = "5"
max_holding_s = 604800                  # 168 h cap
candidate_ttl_s = 900
regime_filter = true

[agent]
decision_provider = "BASELINE"

[backtest]
dataset = "wallex-public-20261022-1h"
approval_policy = "APPROVE_ALL"
split = "ALL"
